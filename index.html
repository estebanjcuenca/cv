<script>
// Site script (CV render, A4 export, dark mode).

// ── Preferences (run before DOMContentLoaded to avoid flash) ──
if (localStorage.getItem('ec-dark') !== '0')
  document.documentElement.classList.add('dark');

const _hiddenOnLoad = new Set(
  Object.entries(JSON.parse(localStorage.getItem('ec-hidden') || '{}'  ))
    .filter(([,v]) => v).map(([k]) => k)
);

// ── Dark mode ──────────────────────────────────────────────────
function toggleDark() {
  const on = document.documentElement.classList.toggle('dark');
  localStorage.setItem('ec-dark', on ? '1' : '0');
}

// ── Section hide/show ──────────────────────────────────────────
function toggleSection(id) {
  const sec = document.getElementById(id);
  if (!sec) return;
  const hidden = sec.classList.toggle('sec-hidden');
  sec.querySelector('.sec-toggle').textContent = hidden ? 'Show' : 'Hide';
  const state = JSON.parse(localStorage.getItem('ec-hidden') || '{}');
  state[id] = hidden;
  localStorage.setItem('ec-hidden', JSON.stringify(state));
}

// ── Scroll reveal — sections render visible; optional stagger only ──
function initScrollReveal() {
  const sections = document.querySelectorAll('.cv-section');
  if (!sections.length) return;
  sections.forEach((el) => el.classList.add('visible'));
}

// ── Helpers ────────────────────────────────────────────────────
function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function parseInline(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/_(.+?)_/g, '<em>$1</em>');
}

// Split a table row on | but respect \| escaped pipes
function splitRow(line) {
  // Replace \| temporarily, split, then restore
  const tmp = line.replace(/\\\|/g, '\x00PIPE\x00');
  const inner = tmp.replace(/^\s*\|\s*|\s*\|\s*$/g, '');
  return inner.split('|').map(c => c.replace(/\x00PIPE\x00/g, '|').trim());
}

// Format a cell: **Bold** becomes title, rest becomes subtitle
function formatCell(text) {
  const m = text.match(/^\*\*(.+?)\*\*\s*[·\-–]?\s*(.*)/);
  if (m) {
    const title = m[1].trim();
    const sub   = m[2].trim();
    return `<span class="ent-title">${parseInline(title)}</span>` +
           (sub ? `<span class="ent-sub">${parseInline(sub)}</span>` : '');
  }
  return parseInline(text);
}

function isSeparatorRow(line) {
  return /^\s*\|?\s*[-:]+[-| :]*$/.test(line);
}

// Rows tagged {dev} in content.md render locally only — hidden on production hosts
const PROD_HOSTS = ['estebancuenca.com', 'www.estebancuenca.com', 'estebanjcuenca.github.io'];

function isDevHost() {
  return PROD_HOSTS.indexOf(location.hostname) < 0;
}

function rowIsDevOnly(cells) {
  return cells.some(c => c.includes('{dev}'));
}

function stripDevMarker(s) {
  return s.replace(/\s*\{dev\}/g, '').trim();
}

// Split entity cells so Role / location align across all tables
function splitEntityCell(text, kind) {
  const m = text.match(/^\*\*(.+?)\*\*\s*(?:·\s*)?(.*)/s);
  if (!m) return { entityHtml: formatCell(text), role: '', premiere: '' };
  const title = m[1].trim();
  const rest  = m[2].trim();
  const titleHtml = `<span class="ent-title">${parseInline(title)}</span>`;

  if (kind === 'company') {
    const parts = rest.split(/\s*·\s*/).filter(Boolean);
    return {
      entityHtml: titleHtml,
      role: parts[0] || '',
      premiere: parts.slice(1).join(' · ') || ''
    };
  }
  if (kind === 'event') {
    return { entityHtml: titleHtml, role: '', premiere: rest ? parseInline(rest) : '' };
  }
  if (kind === 'institution') {
    return { entityHtml: titleHtml, role: '', degree: rest ? parseInline(rest) : '' };
  }
  return { entityHtml: formatCell(text), role: '', premiere: '' };
}

/* Shared 7-column grid — all tables pad to these slots for horizontal alignment */
const MASTER_COLS = [
  { key: 'status',    cls: 'col-status' },
  { key: 'entity',    cls: 'col-entity' },
  { key: 'role',      cls: 'col-role' },
  { key: 'premiere',  cls: 'col-premiere' },
  { key: 'festivals', cls: 'col-festivals' },
  { key: 'awards',    cls: 'col-awards' },
  { key: 'support',   cls: 'col-support' }
];

const COL_LABELS = {
  film: {
    entity: 'Project', role: 'Role', premiere: 'Premiere',
    festivals: 'Festivals', awards: 'Awards', support: 'Support'
  },
  commercial: {
    entity: 'Company', role: 'Role', premiere: 'Location',
    festivals: 'Clients', awards: '', support: ''
  },
  event: {
    entity: 'Event', role: 'Role', premiere: 'Location',
    festivals: 'Details', awards: '', support: ''
  },
  education: {
    entity: 'Institution', role: 'Degree', premiere: '',
    festivals: 'Details', awards: '', support: ''
  }
};

function tableKind(headers) {
  const hl = headers.map(h => h.toLowerCase());
  if (hl.includes('status')) return 'film';
  if (hl.includes('company')) return 'commercial';
  if (hl.includes('event')) return 'event';
  if (hl.includes('institution')) return 'education';
  return 'generic';
}

function normalizeTable(headers, rows) {
  const hl = headers.map(h => h.toLowerCase());
  const kind = tableKind(headers);
  const labels = COL_LABELS[kind] || COL_LABELS.film;

  const canon = MASTER_COLS.map(col => {
    let cls = col.cls;
    if (col.key === 'festivals' && kind === 'film') cls += ' hide-mobile';
    if ((col.key === 'awards' || col.key === 'support') && kind === 'film') cls += ' hide-mobile';
    return { key: col.key, label: labels[col.key] || '', cls };
  });

  const visibleRows = rows.filter(cells => !rowIsDevOnly(cells) || isDevHost());

  const data = visibleRows.map(cells => {
    const raw = {};
    const html = {};
    hl.forEach((h, i) => { raw[h] = stripDevMarker(cells[i] || ''); });

    if (kind === 'film' && raw.project) {
      html.entity = formatCell(raw.project);
    } else if (kind === 'commercial' && raw.company) {
      const s = splitEntityCell(raw.company, 'company');
      html.entity = s.entityHtml;
      raw.role = s.role;
      raw.premiere = s.premiere;
      raw.festivals = raw.clients || '';
    } else if (kind === 'event' && raw.event) {
      const s = splitEntityCell(raw.event, 'event');
      html.entity = s.entityHtml;
      raw.premiere = s.premiere;
      raw.festivals = raw.details || '';
    } else if (kind === 'education' && raw.institution) {
      const s = splitEntityCell(raw.institution, 'institution');
      html.entity = s.entityHtml;
      raw.role = s.degree || '';
      raw.festivals = raw.details || '';
    }

    return { raw, html };
  });

  return { canon, data, kind };
}

// ── Table builder ──────────────────────────────────────────────
function buildTable(headers, rows) {
  const { canon, data } = normalizeTable(headers, rows);

  let out = '<div class="table-wrap"><table class="cv-table"><colgroup>';
  canon.forEach(col => { out += `<col class="${col.cls.split(' ')[0]}">`; });
  out += '</colgroup><thead><tr>';

  canon.forEach(col => {
    const label = col.label ? parseInline(col.label) : '';
    const labelAttr = label ? ` data-label="${label.replace(/"/g, '&quot;')}"` : '';
    out += `<th class="${col.cls}"${labelAttr}>${col.key === 'status' ? '' : label}</th>`;
  });
  out += '</tr></thead><tbody>';

  data.forEach(({ raw, html }) => {
    out += '<tr>';
    canon.forEach(col => {
      const c = ` class="${col.cls}"`;
      const label = col.label ? parseInline(col.label) : col.key;
      const labelAttr = col.key === 'status' ? '' :
        ` data-label="${label.replace(/"/g, '&quot;')}"`;

      if (col.key === 'status') {
        if (!raw.status) {
          out += `<td class="${col.cls} col-status-empty"${labelAttr}></td>`;
        } else {
          const done = raw.status.toLowerCase() === 'done';
          out += `<td${c}><span class="dot ${done ? 'dot-done' : 'dot-wip'}"></span></td>`;
        }
      } else if (col.key === 'entity') {
        const content = html.entity || '';
        out += `<td${c}${labelAttr}>${content}</td>`;
      } else {
        const val = raw[col.key] || '';
        // "—"/"-" are used in content.md as an explicit placeholder for
        // "nothing here" — treat them the same as a truly empty cell so
        // the record layout collapses the block instead of showing a
        // labeled row with just a dash in it.
        const isPlaceholder = /^[-—]$/.test(val.trim());
        if (col.key === 'awards' && val.includes('{wip}')) {
          const sepIdx = val.indexOf('{wip}');
          const main = val.slice(0, sepIdx).trim();
          const wip  = val.slice(sepIdx + 5).trim();
          const mainHtml = main ? parseInline(main) : '';
          const wipHtml  = wip  ? `<span class="award-wip">${main ? ' · ' : ''}${parseInline(wip)}</span>` : '';
          out += `<td${c}${labelAttr}>${mainHtml}${wipHtml}</td>`;
        } else {
          out += `<td${c}${labelAttr}>${val && !isPlaceholder ? parseInline(val) : ''}</td>`;
        }
      }
    });
    out += '</tr>';
  });

  out += '</tbody></table></div>';
  return out;
}

// ── Frontmatter parser ─────────────────────────────────────────
function parseFrontmatter(raw) {
  const m = raw.match(/^\s*---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!m) return { meta: {}, body: raw };
  const meta = {};
  m[1].split('\n').forEach(line => {
    const colon = line.indexOf(':');
    if (colon < 0) return;
    meta[line.slice(0, colon).trim()] = line.slice(colon + 1).trim();
  });
  return { meta, body: m[2] };
}

// ── Main render ────────────────────────────────────────────────
async function render() {
  let raw = '';
  try {
    // Single source of truth: the main site's content.md, fetched live.
    // Keeps this CV export in sync with the portfolio without a manual
    // copy/sync step — only edit content.md on the main site.
    const res = await fetch('https://www.estebancuenca.com/content.md');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    raw = await res.text();
  } catch (err) {
    console.error('Could not load content.md:', err);
    document.getElementById('cv-bio').innerHTML =
      '<p>Could not load <code>content.md</code> from the main site. Check that www.estebancuenca.com is reachable.</p>';
    return;
  }
  const { meta, body } = parseFrontmatter(raw);

  // ── Meta fields ──
  if (meta.photo) {
    const photoEl = document.getElementById('cv-photo');
    photoEl.src = meta.photo;
    const smallPhoto = meta.photo.replace(/(\.\w+)$/, '-800$1');
    photoEl.srcset = `${smallPhoto} 800w, ${meta.photo} 1024w`;
    photoEl.sizes = '(max-width: 768px) 100vw, 40vw';
  }
  if (meta.subtitle) document.getElementById('cv-subtitle').textContent = meta.subtitle;

  // ── Parse body lines ──
  const lines = body.split('\n');
  let name        = '';
  let bioParts    = [];   // strings + '' for blank lines
  let sections    = [];
  let cur         = null; // current section
  let tblHeaders  = null;
  let tblRows     = [];

  function flushTable() {
    if (cur && tblHeaders) {
      cur.tables.push({ headers: tblHeaders, rows: tblRows });
    }
    tblHeaders = null; tblRows = [];
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();

    // H1 = name
    if (trimmed.startsWith('# ') && !trimmed.startsWith('## ')) {
      name = trimmed.slice(2).trim();
      continue;
    }

    // H2 = new section
    if (trimmed.startsWith('## ')) {
      flushTable();
      if (cur) sections.push(cur);
      cur = { title: trimmed.slice(3).trim(), tables: [], paras: [] };
      continue;
    }

    // Table row
    if (trimmed.startsWith('|')) {
      const next = (lines[i + 1] || '').trim();
      if (!tblHeaders && isSeparatorRow(lines[i + 1] || '')) {
        // Header row
        tblHeaders = splitRow(trimmed);
        i++; // skip separator
        continue;
      } else if (tblHeaders && !isSeparatorRow(trimmed)) {
        tblRows.push(splitRow(trimmed));
        continue;
      }
    } else if (tblHeaders) {
      flushTable();
    }

    // Blank line
    if (!trimmed) {
      if (!cur) bioParts.push('');
      continue;
    }

    // Paragraph text
    if (!trimmed.startsWith('#')) {
      if (!cur) bioParts.push(trimmed);
      else      cur.paras.push(trimmed);
    }
  }
  flushTable();
  if (cur) sections.push(cur);

  // ── Separate {drift} / {100film} variant resumes from CV sections ──
  window._cvVariantData = {};
  CV_VARIANTS.forEach(v => {
    const sec = sections.find(s => s.title.includes(v.marker));
    sections = sections.filter(s => !s.title.includes(v.marker));
    if (sec) window._cvVariantData[v.id] = parseCvVariantParas(sec.paras);
  });

  // ── Separate {eave-ipp} applicant notes from CV sections ──
  const eaveIppSec = sections.find(s => s.title.includes('{eave-ipp}'));
  sections = sections.filter(s => !s.title.includes('{eave-ipp}'));
  if (eaveIppSec) {
    const cleanTitle = eaveIppSec.title.replace('{eave-ipp}', '').trim();
    const setElI = (sel, html, asText) => {
      const el = document.querySelector(sel);
      if (!el) return;
      if (asText) el.textContent = html; else el.innerHTML = html;
    };
    setElI('#a4-eave-ipp-page .eave-doc-title', cleanTitle, true);
    setElI('#a4-eave-ipp-page .eave-paras',
      eaveIppSec.paras.map(p => `<p>${parseInline(p)}</p>`).join(''));
    setElI('#a4-eave-ipp-page .eave-lh-name', name, true);
    setElI('#a4-eave-ipp-page .eave-lh-subtitle', meta.subtitle || '', true);
    setElI('#a4-eave-ipp-page .eave-footer-email', meta.email || '', true);
    setElI('#a4-eave-ipp-page .eave-footer-location', meta.location || '', true);
  }

  // ── Separate {eave} sections from CV sections ──
  const eaveSec = sections.find(s => s.title.includes('{eave}'));
  sections = sections.filter(s => !s.title.includes('{eave}'));
  if (eaveSec) {
    const paras = eaveSec.paras;
    // Split at "**About HANA FILMS**" — a paragraph that is entirely bold
    const aboutIdx = paras.findIndex(p => /^\*\*[^*]+\*\*$/.test(p.trim()));
    const bodyParas = aboutIdx >= 0 ? paras.slice(0, aboutIdx) : paras;
    const aboutLabel = aboutIdx >= 0 ? paras[aboutIdx].replace(/\*\*/g, '') : null;
    const aboutParas = aboutIdx >= 0 ? paras.slice(aboutIdx + 1) : [];

    const cleanTitle = eaveSec.title.replace('{eave}', '').trim();
    const setEl = (sel, html, asText) => {
      const el = document.querySelector(sel);
      if (!el) return;
      if (asText) el.textContent = html; else el.innerHTML = html;
    };
    setEl('#a4-eave-page .eave-doc-title', cleanTitle, true);
    setEl('#a4-eave-page .eave-paras',
      bodyParas.map(p => `<p>${parseInline(p)}</p>`).join(''));
    if (aboutLabel) {
      setEl('#a4-eave-page .eave-about',
        `<p class="eave-about-label">${aboutLabel}</p>` +
        aboutParas.map(p => `<p>${parseInline(p)}</p>`).join(''));
    }
    // Populate letterhead and footer from parsed meta / DOM
    setEl('#a4-eave-page .eave-lh-name', name, true);
    setEl('#a4-eave-page .eave-lh-subtitle', meta.subtitle || '', true);
    setEl('#a4-eave-page .eave-footer-email', meta.email || '', true);
    setEl('#a4-eave-page .eave-footer-location', meta.location || '', true);
  }

  // ── Set name ──
  document.getElementById('cv-name').textContent = name;
  document.title = name + (meta.subtitle ? ' — ' + meta.subtitle : '');

  const footerRight = [];
  if (meta.privacy) footerRight.push(`<a class="footer-privacy" href="${meta.privacy}">Privacy Policy</a>`);
  if (meta.location) footerRight.push(`<span class="footer-location footer-plain">${meta.location}</span>`);
  footerRight.push(`<span class="footer-copyright footer-plain">© ${new Date().getFullYear()} ${name}. All rights reserved.</span>`);
  footerRight.push(`<span class="footer-actions" id="footer-actions">
    <button class="footer-btn footer-icon-btn" id="btn-export" type="button" title="Export PDF" aria-label="Export PDF">
      <svg class="footer-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <rect x="2.5" y="3.5" width="6.5" height="9" rx="0.5" stroke="currentColor" stroke-width="1.15" fill="none"/>
        <path d="M9.5 8H13M11.5 6l2 2-2 2" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span id="footer-export-actions" hidden>
      <button class="footer-btn" id="btn-print" type="button">Print</button>
    </span>
  </span>`);
  const footerLeft = meta.email
    ? `<span class="footer-left"><a href="mailto:${meta.email}">${meta.email}</a></span>` : '';
  const footerRightHtml = footerRight.length
    ? `<span class="footer-right">${footerRight.join('')}</span>` : '';
  document.getElementById('cv-footer').innerHTML = footerLeft + footerRightHtml;

  // ── Render bio: split on blank lines into <p> tags ──
  const bioParas = [];
  let para = [];
  bioParts.forEach(part => {
    if (part === '') {
      if (para.length) { bioParas.push(para.join(' ')); para = []; }
    } else {
      para.push(part);
    }
  });
  if (para.length) bioParas.push(para.join(' '));
  document.getElementById('cv-bio').innerHTML =
    bioParas.map(p => `<p>${parseInline(p)}</p>`).join('');

  // ── Render sections ──
  document.getElementById('cv-sections').innerHTML = sections.map(sec => {
    const slug  = slugify(sec.title);
    const id    = `sec-${slug}`;
    const tbls  = sec.tables.map(t => buildTable(t.headers, t.rows)).join('');
    const paras = sec.paras.map(p => `<p>${parseInline(p)}</p>`).join('');
    return `<section class="cv-section visible" id="${id}">
      <div class="sec-head">
        <span class="sec-label">${parseInline(sec.title)}</span>
        <button class="sec-toggle" onclick="toggleSection('${id}')">Hide</button>
      </div>
      <div class="sec-body"><div class="sec-body-inner">${tbls}${paras}</div></div>
    </section>`;
  }).join('');

  // ── Restore hidden sections ──
  _hiddenOnLoad.forEach(id => {
    const sec = document.getElementById(id);
    if (!sec) return;
    sec.classList.add('sec-hidden');
    const btn = sec.querySelector('.sec-toggle');
    if (btn) btn.textContent = 'Show';
  });

  // ── Init scroll animations ──
  initScrollReveal();
}

// ── Export mode: inline A4 preview, print = WYSIWYG ──
var PRINT_PAGE_H_PX = 277 * (96 / 25.4);
var A4_PAGE_W_PX = 210 * (96 / 25.4);
var a4Anchors = { hero: null, work: null };

function isA4Mode() {
  return document.documentElement.classList.contains('a4-mode');
}

function isOnePageMode() {
  return document.documentElement.classList.contains('a4-one-page');
}

function isEaveMode() {
  return document.documentElement.classList.contains('a4-eave');
}

function setOnePageMode(on) {
  var html = document.documentElement;
  var btn = document.getElementById('btn-one-page');
  if (on) {
    html.classList.add('a4-one-page');
    if (btn) { btn.textContent = '2 pg'; btn.title = 'Switch to two-page layout'; }
  } else {
    html.classList.remove('a4-one-page');
    if (btn) { btn.textContent = '1 pg'; btn.title = 'Switch to one-page layout'; }
  }
  if (isA4Mode()) {
    unmountA4Content();
    mountA4Content();
    if (activeCvVariant()) applyVariantOverrides();
    preparePrintLayout();
  }
}

// ── Variant CV modes (DRIFT, 100% Film, …) ─────────────────────
var CV_VARIANTS = [
  { id: 'drift',   marker: '{drift}',   cls: 'a4-drift',   btn: 'btn-drift' },
  { id: '100film', marker: '{100film}', cls: 'a4-100film', btn: 'btn-100film' }
];
window._cvVariantData = {};
var _variantOrig = null;

function parseCvVariantParas(paras) {
  const firstIdx = paras.findIndex(p => p.trim());
  const firstPara = firstIdx >= 0 ? paras[firstIdx].trim() : '';
  const isRole = /^[A-Z][A-Z ,&\/\-\.&]+$/.test(firstPara);
  const customRole = isRole ? firstPara : '';
  const rest = isRole ? paras.slice(firstIdx + 1) : paras.slice(firstIdx);
  const divIdx = rest.findIndex(p => /^\*\*[A-Z][A-Z ,&\/\-\.]+\*\*$/.test(p.trim()));
  const bioParas = divIdx >= 0 ? rest.slice(0, divIdx) : rest;
  const secTitle = divIdx >= 0 ? rest[divIdx].replace(/\*\*/g, '') : '';
  const bulletParas = divIdx >= 0 ? rest.slice(divIdx + 1) : [];
  return {
    role: customRole,
    bioHTML: bioParas.filter(p => p.trim()).map(p => `<p>${parseInline(p)}</p>`).join(''),
    secTitle: secTitle,
    bulletsHTML: bulletParas.filter(p => p.startsWith('- '))
      .map(p => `<li>${parseInline(p.slice(2))}</li>`).join('')
  };
}

function activeCvVariant() {
  for (var i = 0; i < CV_VARIANTS.length; i++) {
    if (document.documentElement.classList.contains(CV_VARIANTS[i].cls)) return CV_VARIANTS[i];
  }
  return null;
}

function isDriftMode() {
  var v = activeCvVariant();
  return v && v.id === 'drift';
}

function is100FilmMode() {
  var v = activeCvVariant();
  return v && v.id === '100film';
}

function applyVariantOverrides() {
  var v = activeCvVariant();
  if (!v || !window._cvVariantData[v.id]) return;
  var d = window._cvVariantData[v.id];
  var subtitleEl = document.getElementById('cv-subtitle');
  var bioEl      = document.getElementById('cv-bio');
  var sectionsEl = document.getElementById('cv-sections');
  _variantOrig = {
    subtitle: subtitleEl ? subtitleEl.textContent : '',
    bio:      bioEl      ? bioEl.innerHTML        : ''
  };
  if (subtitleEl) subtitleEl.textContent = d.role;
  if (bioEl)      bioEl.innerHTML        = d.bioHTML;
  if (sectionsEl && (d.secTitle || d.bulletsHTML) && !document.getElementById('variant-skills-block')) {
    var block = document.createElement('div');
    block.id = 'variant-skills-block';
    block.innerHTML =
      '<h2 class="variant-skills-title">' + d.secTitle + '</h2>' +
      '<ul class="variant-skills-list">' + d.bulletsHTML + '</ul>';
    sectionsEl.parentNode.insertBefore(block, sectionsEl);
  }
}

function removeVariantOverrides() {
  if (_variantOrig) {
    var subtitleEl = document.getElementById('cv-subtitle');
    var bioEl      = document.getElementById('cv-bio');
    if (subtitleEl) subtitleEl.textContent = _variantOrig.subtitle;
    if (bioEl)      bioEl.innerHTML        = _variantOrig.bio;
    _variantOrig = null;
  }
  var block = document.getElementById('variant-skills-block');
  if (block && block.parentNode) block.parentNode.removeChild(block);
}

function setCvVariantMode(variantId, on) {
  var target = CV_VARIANTS.find(function(v) { return v.id === variantId; });
  if (!target) return;
  var html  = document.documentElement;
  var page2 = document.getElementById('a4-page-2');
  if (on) {
    if (isEaveMode()) setEaveMode(false);
    CV_VARIANTS.forEach(function(v) {
      html.classList.remove(v.cls);
      var b = document.getElementById(v.btn);
      if (b) b.classList.remove('active');
    });
    removeVariantOverrides();
    html.classList.add(target.cls);
    var btn = document.getElementById(target.btn);
    if (btn) btn.classList.add('active');
    html.classList.add('a4-one-page');
    if (page2) page2.hidden = true;
    var onePgBtn = document.getElementById('btn-one-page');
    if (onePgBtn) { onePgBtn.textContent = '2 pg'; onePgBtn.title = 'Switch to two-page layout'; }
    if (isA4Mode()) {
      unmountA4Content();
      mountA4Content();
      applyVariantOverrides();
      preparePrintLayout();
    }
  } else {
    removeVariantOverrides();
    html.classList.remove(target.cls);
    var offBtn = document.getElementById(target.btn);
    if (offBtn) offBtn.classList.remove('active');
    if (isA4Mode()) {
      unmountA4Content();
      mountA4Content();
      preparePrintLayout();
    }
  }
}

function setDriftMode(on) { setCvVariantMode('drift', on); }
function set100FilmMode(on) { setCvVariantMode('100film', on); }

function setEaveMode(on) {
  var html = document.documentElement;
  var btn = document.getElementById('btn-eave');
  var eavePage = document.getElementById('a4-eave-page');
  if (on) {
    CV_VARIANTS.forEach(function(v) {
      html.classList.remove(v.cls);
      var b = document.getElementById(v.btn);
      if (b) b.classList.remove('active');
    });
    removeVariantOverrides();
    html.classList.add('a4-eave');
    if (btn) btn.classList.add('active');
    if (eavePage) eavePage.hidden = false;
    // EAVE always uses the one-page layout for page 1
    html.classList.add('a4-one-page');
    var onePgBtn = document.getElementById('btn-one-page');
    if (onePgBtn) { onePgBtn.textContent = '2 pg'; onePgBtn.title = 'Switch to two-page layout'; }
  } else {
    html.classList.remove('a4-eave');
    if (btn) btn.classList.remove('active');
    if (eavePage) eavePage.hidden = true;
  }
  if (isA4Mode()) {
    unmountA4Content();
    mountA4Content();
    preparePrintLayout();
  }
}

function activeNavBar() {
  return document.getElementById('toolbar');
}

function applyWorkScale(pct) {
  var scale = Math.max(0.5, Math.min(1, (pct || 100) / 100));
  document.documentElement.style.setProperty('--a4-work-scale', String(scale));
  var page1 = document.getElementById('a4-page-1');
  var page1Body = document.getElementById('a4-page-1-body');
  var page2 = document.getElementById('a4-page-2');
  var eavePg = document.getElementById('a4-eave-page');
  if (isOnePageMode()) {
    if (page1Body) page1Body.style.setProperty('--a4-work-scale', String(scale));
    else if (page1) page1.style.setProperty('--a4-work-scale', String(scale));
  } else {
    if (page1)  page1.style.setProperty('--a4-work-scale', String(scale));
    if (page2)  page2.style.setProperty('--a4-work-scale', String(scale));
  }
  if (eavePg) eavePg.style.setProperty('--a4-work-scale', String(scale));
}

function autoFitWorkScale() {
  var target = document.getElementById(isOnePageMode() ? 'a4-page-1-body' : 'a4-page-2');
  var page = document.getElementById(isOnePageMode() ? 'a4-page-1' : 'a4-page-2');
  if (!target || !page) return;
  applyWorkScale(100);
  void page.offsetHeight;

  if (isOnePageMode()) {
    var footer = document.getElementById('cv-footer');
    var footerH = footer ? footer.offsetHeight : 0;
    var limit = page.clientHeight;
    var bodyH = target.scrollHeight;
    if (limit > 0 && bodyH > 0 && bodyH + footerH > limit) {
      var pct = Math.floor(((limit - footerH) / bodyH) * 97);
      applyWorkScale(Math.max(50, Math.min(100, pct)));
      void page.offsetHeight;
      bodyH = target.scrollHeight;
      if (bodyH + footerH > limit) {
        pct = Math.floor(((limit - footerH) / bodyH) * 97);
        applyWorkScale(Math.max(50, Math.min(100, pct)));
      }
    }
    return;
  }

  if (target.scrollHeight > page.clientHeight) {
    applyWorkScale(Math.min(100, Math.round((page.clientHeight / target.scrollHeight) * 97)));
  }
}

var MM_PX = 96 / 25.4;
var ONE_PAGE_SEC_EXTRA_MAX_MM = 5.5;

function distributeOnePageSectionGap() {
  var root = document.documentElement;
  root.style.setProperty('--one-page-sec-extra', '0mm');
  if (!isA4Mode() || !isOnePageMode()) return;

  var page = document.getElementById('a4-page-1');
  var body = document.getElementById('a4-page-1-body');
  var footer = document.getElementById('cv-footer');
  var sections = document.querySelectorAll('#cv-sections .cv-section:not(.sec-hidden)');
  if (!page || !body || sections.length < 2) return;

  var gaps = sections.length - 1;
  var footerH = footer ? footer.offsetHeight : 0;
  var slack = page.clientHeight - body.scrollHeight - footerH;
  if (slack <= 4) return;

  var extraPx = Math.min(slack / gaps, ONE_PAGE_SEC_EXTRA_MAX_MM * MM_PX);
  root.style.setProperty('--one-page-sec-extra', (extraPx / MM_PX).toFixed(1) + 'mm');
}

function preparePrintLayout() {
  if (!isA4Mode()) return;
  document.documentElement.style.removeProperty('--one-page-sec-extra');
  autoFitWorkScale();
  distributeOnePageSectionGap();
  autoFitWorkScale();
  syncA4ToolbarOffset();
  updateA4ViewportScale();
}

function syncA4ToolbarOffset() {
  var tb = activeNavBar();
  var stage = document.getElementById('a4-stage');
  if (!tb || !stage || !isA4Mode()) return;
  stage.style.paddingTop = (tb.offsetHeight + 12) + 'px';
}

function updateA4ViewportScale() {
  var pages = document.getElementById('a4-pages');
  if (!pages || !isA4Mode()) return;
  var scale = Math.min(1, (window.innerWidth - 32) / A4_PAGE_W_PX);
  pages.style.zoom = scale < 1 ? String(scale) : '';
}

function mountA4Content() {
  var hero   = document.getElementById('hero');
  var work   = document.getElementById('print-work');
  var footer = document.getElementById('cv-footer');
  var page1  = document.getElementById('a4-page-1');
  var page1Body = document.getElementById('a4-page-1-body');
  var page2  = document.getElementById('a4-page-2');
  if (!hero || !work || !page1 || !page2) return;
  if (!a4Anchors.hero) {
    a4Anchors.hero   = { parent: hero.parentNode,   next: hero.nextSibling };
    a4Anchors.work   = { parent: work.parentNode,   next: work.nextSibling };
    a4Anchors.footer = footer ? { parent: footer.parentNode, next: footer.nextSibling } : null;
  }
  if (isOnePageMode()) {
    var bodyHost = page1Body || page1;
    bodyHost.appendChild(hero);
    bodyHost.appendChild(work);
    if (footer) page1.appendChild(footer);
    page2.hidden = true;
  } else {
    page1.appendChild(hero);
    page2.appendChild(work);
    if (footer) page2.appendChild(footer);
    page2.hidden = false;
  }
}

function unmountA4Content() {
  var hero   = document.getElementById('hero');
  var work   = document.getElementById('print-work');
  var footer = document.getElementById('cv-footer');
  if (!hero || !work || !a4Anchors.hero || !a4Anchors.work) return;
  var hA = a4Anchors.hero;
  var wA = a4Anchors.work;
  var fA = a4Anchors.footer;
  if (hA.next) hA.parent.insertBefore(hero, hA.next);
  else hA.parent.appendChild(hero);
  if (wA.next) wA.parent.insertBefore(work, wA.next);
  else wA.parent.appendChild(work);
  if (footer && fA) {
    if (fA.next) fA.parent.insertBefore(footer, fA.next);
    else fA.parent.appendChild(footer);
  }
}

function syncExportNav(on) {
  var site = document.getElementById('toolbar-site');
  var exportBar = document.getElementById('toolbar-export');
  if (site) site.hidden = on;
  if (exportBar) exportBar.hidden = !on;
}

function setA4Mode(on) {
  var html = document.documentElement;
  var stage = document.getElementById('a4-stage');
  var footerExport = document.getElementById('btn-export');
  var footerExportActions = document.getElementById('footer-export-actions');
  if (on) {
    mountA4Content();
    if (activeCvVariant()) applyVariantOverrides();
    html.classList.add('a4-mode');
    syncExportNav(true);
    if (stage) stage.removeAttribute('hidden');
    if (footerExport) footerExport.hidden = true;
    if (footerExportActions) footerExportActions.hidden = false;
    preparePrintLayout();
    window.scrollTo(0, 0);
  } else {
    removeVariantOverrides();
    html.classList.remove('a4-mode');
    html.classList.remove('a4-one-page');
    html.classList.remove('a4-eave');
    CV_VARIANTS.forEach(function(v) {
      html.classList.remove(v.cls);
      var b = document.getElementById(v.btn);
      if (b) b.classList.remove('active');
    });
    var onePgBtn = document.getElementById('btn-one-page');
    if (onePgBtn) { onePgBtn.textContent = '1 pg'; onePgBtn.title = 'Switch to one-page layout'; }
    var eaveBtn = document.getElementById('btn-eave');
    if (eaveBtn) eaveBtn.classList.remove('active');
    var eavePage = document.getElementById('a4-eave-page');
    if (eavePage) eavePage.hidden = true;
    var page1off  = document.getElementById('a4-page-1');
    var page1BodyOff = document.getElementById('a4-page-1-body');
    var page2off  = document.getElementById('a4-page-2');
    var eaveOff   = document.getElementById('a4-eave-page');
    if (page1off) page1off.style.removeProperty('--a4-work-scale');
    if (page1BodyOff) page1BodyOff.style.removeProperty('--a4-work-scale');
    if (eaveOff)  eaveOff.style.removeProperty('--a4-work-scale');
    if (page2off) page2off.hidden = false;
    syncExportNav(false);
    if (stage) {
      stage.setAttribute('hidden', '');
      stage.style.paddingTop = '';
    }
    var pages = document.getElementById('a4-pages');
    if (pages) pages.style.zoom = '';
    if (page2off) page2off.style.removeProperty('--a4-work-scale');
    document.documentElement.style.removeProperty('--a4-work-scale');
    document.documentElement.style.removeProperty('--one-page-sec-extra');
    if (footerExport) footerExport.hidden = false;
    if (footerExportActions) footerExportActions.hidden = true;
    unmountA4Content();
  }
}

function enterExportMode() {
  setA4Mode(true);
}

function exportA4() {
  if (!isA4Mode()) setA4Mode(true);
  preparePrintLayout();
  window.print();
}

var a4EnteredForPrint = false;

function initA4Controls() {
  if (initA4Controls.bound) return;
  initA4Controls.bound = true;
  document.addEventListener('click', function(e) {
    if (e.target.closest('#btn-export')) { enterExportMode(); return; }
    if (e.target.closest('#btn-print')) { exportA4(); return; }
    if (e.target.closest('#btn-nav-back')) { setA4Mode(false); return; }
    if (e.target.closest('#btn-one-page')) { setOnePageMode(!isOnePageMode()); return; }
    if (e.target.closest('#btn-drift')) { setCvVariantMode('drift', !isDriftMode()); return; }
    if (e.target.closest('#btn-100film')) { setCvVariantMode('100film', !is100FilmMode()); return; }
    if (e.target.closest('#btn-eave')) { setEaveMode(!isEaveMode()); return; }
  });
  window.addEventListener('resize', function() {
    if (!isA4Mode()) return;
    syncA4ToolbarOffset();
    updateA4ViewportScale();
  });
  window.addEventListener('beforeprint', function() {
    if (!isA4Mode()) {
      a4EnteredForPrint = true;
      setA4Mode(true);
    }
    preparePrintLayout();
  });
  window.addEventListener('afterprint', function() {
    if (a4EnteredForPrint) {
      a4EnteredForPrint = false;
      setA4Mode(false);
    }
  });
}

document.addEventListener('DOMContentLoaded', async function() {
  // This subdomain exists only to show the A4 export view — skip the
  // normal inline landing entirely and open straight into it once the
  // content has loaded, instead of requiring a click on the export icon.
  initA4Controls();
  await render();
  enterExportMode();
});

</script>
